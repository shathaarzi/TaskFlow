<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

<header>

<h1>📋 TaskFlow</h1>

<p>Organize, prioritize and track your daily tasks.</p>

</header>

<section class="task-form">

<input
id="title"
type="text"
placeholder="Task Title"
>

<textarea
id="description"
placeholder="Description"
></textarea>

<div class="row">

<select id="priority">

<option>High</option>
<option selected>Medium</option>
<option>Low</option>

</select>

<input
id="dueDate"
type="datetime-local"
>

</div>

<button id="addTaskBtn">

➕ Add Task

</button>

</section>

<section>

<div class="search-box">

    <input
        id="searchInput"
        type="text"
        placeholder="🔍 Search tasks..."
    >

</div>

<div class="filters">

    <button
        id="allBtn"
        class="filter-btn active">

        All

    </button>

    <button
        id="pendingBtn"
        class="filter-btn">

        Pending

    </button>

    <button
        id="completedBtn"
        class="filter-btn">

        Completed

    </button>

</div>

<h2>Your Tasks</h2>

<div class="stats">

<div class="stat-card">

<h3 id="totalTasks">0</h3>

<p>📋 Total</p>

</div>

<div class="stat-card">

<h3 id="completedTasks">0</h3>

<p>✅ Completed</p>

</div>

<div class="stat-card">

<h3 id="pendingTasks">0</h3>

<p>⏳ Pending</p>

</div>

</div>

<div id="taskList">

</div>

</section>

</div>

<div id="toastContainer"></div>

<script src="script.js"></script>

</body>
</html>
